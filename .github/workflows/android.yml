name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/maxpaint-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maxpaint-apk
          path: out/*.apk
          if-no-files-found: error

  verify-shaders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install glslang and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools libegl1-mesa-dev \
                                     libgles2-mesa-dev libgl1-mesa-dri
          python3 -m pip install --quiet PyOpenGL numpy

      - name: Validate shaders and run the solver checks
        run: tools/verify.sh --res 128

      - name: Run the FLIP particle checks
        run: EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 python3 tools/verify_flip.py
