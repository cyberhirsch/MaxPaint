name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count; a shallow clone would report 1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect the APK
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/maxpaint-*-debug.apk out/
          NAME=$(basename out/maxpaint-*-debug.apk .apk)
          echo "name=${NAME%-debug}" >> "$GITHUB_OUTPUT"
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # unique per build, so downloads are distinguishable in the UI
          name: ${{ steps.apk.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

  verify-shaders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install glslang and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools libegl1-mesa-dev \
                                     libgles2-mesa-dev libgl1-mesa-dri
          python3 -m pip install --quiet PyOpenGL numpy

      - name: Validate shaders and run the solver checks
        run: tools/verify.sh --res 128

      - name: Run the FLIP particle checks
        run: EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 python3 tools/verify_flip.py
